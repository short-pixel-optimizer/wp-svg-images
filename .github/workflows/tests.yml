# Release gate: every implemented suite on the supported matrix, through the
# same bin/test.sh used locally (zero-test guard included). No retries.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/test.sh --verify

  suites:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}${{ matrix.advisory && ' (advisory)' || '' }}
    needs: verify
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.4', wp: '6.4', advisory: false }
          - { php: '8.1', wp: '6.9', advisory: false }
          - { php: '8.3', wp: '7.0', advisory: false }
          - { php: '8.4', wp: latest, advisory: false }
          - { php: '8.5', wp: latest, advisory: true }
          - { php: '8.3', wp: nightly, advisory: true }
    steps:
      - uses: actions/checkout@v4

      - name: Run all suites
        run: bin/test.sh all --php '${{ matrix.php }}' --wp '${{ matrix.wp }}'

      - name: Executed test counts
        if: always()
        run: |
          {
            echo "### PHP ${{ matrix.php }} / WP ${{ matrix.wp }}"
            echo
            echo "| Suite | Tests | Assertions | Failures | Errors | Skipped |"
            echo "|---|---:|---:|---:|---:|---:|"
            for f in tests/.results/*.summary; do
              [ -f "$f" ] || { echo "| (no suite produced a report) | 0 | | | | |"; break; }
              v() { sed -n "s/^$1=//p" "$f"; }
              echo "| $(basename "$f" .summary) | $(v tests) | $(v assertions) | $(v failures) | $(v errors) | $(v skipped) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-php${{ matrix.php }}-wp${{ matrix.wp }}
          path: tests/.results/
          if-no-files-found: warn
