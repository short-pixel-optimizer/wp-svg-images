# Release gate: every implemented suite on the supported matrix, through the
# same bin/test.sh used locally (zero-test guard included). No retries.
name: Tests

# Every push to `updates` runs the gate, and so does every pull request into
# `updates` (feature branches) or `main` (release pull requests). Any other
# branch can be run by hand from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [updates]
  pull_request:
    branches: [updates, main]
  workflow_dispatch:

# Pull requests: one group per pull request, so a newer push cancels the stale
# run. Pushes and manual runs: a unique group per run, so every commit on
# `updates` keeps its own verdict.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job below skips pull_request runs whose source branch is `updates` in
# this repository (the release pull request into `main`): the push to
# `updates` has already tested that exact commit. GitHub reports a job skipped
# by `if` as passing, so it never blocks the pull request.

permissions:
  contents: read

jobs:
  verify:
    name: Verify environment
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'updates' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/test.sh --verify

  suites:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}${{ matrix.advisory && ' (advisory)' || '' }}
    needs: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'updates' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.4', wp: '6.4', advisory: false }
          - { php: '8.3', wp: '7.0', advisory: false }
          - { php: '8.5', wp: latest, advisory: false }
          - { php: '8.3', wp: nightly, advisory: true }
    steps:
      - uses: actions/checkout@v4

      - name: Run all suites
        run: bin/test.sh all --php '${{ matrix.php }}' --wp '${{ matrix.wp }}'

      - name: Executed test counts
        if: always()
        run: |
          {
            echo "### PHP ${{ matrix.php }} / WP ${{ matrix.wp }}"
            echo
            echo "| Suite | Tests | Assertions | Failures | Errors | Skipped |"
            echo "|---|---:|---:|---:|---:|---:|"
            for f in tests/.results/*.summary; do
              [ -f "$f" ] || { echo "| (no suite produced a report) | 0 | | | | |"; break; }
              v() { sed -n "s/^$1=//p" "$f"; }
              echo "| $(basename "$f" .summary) | $(v tests) | $(v assertions) | $(v failures) | $(v errors) | $(v skipped) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-php${{ matrix.php }}-wp${{ matrix.wp }}
          path: tests/.results/
          if-no-files-found: warn
